<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LexiCard German</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f6f2;--sf:#fbfbf8;--sf2:#f1eee9;--tx:#23211d;--mu:#76736d;--bd:#d6d1c8;--pr:#0f6c72;--ok:#4d7f2a;--wa:#9c5d00;--er:#a12c7b;--r:16px}
[data-theme=dark]{--bg:#171614;--sf:#1d1c19;--sf2:#242320;--tx:#d2d0cb;--mu:#8a867f;--bd:#3b3834;--pr:#5aa0aa;--ok:#83b25f;--wa:#e3a44f;--er:#d06ba8}
*{box-sizing:border-box}html,body{margin:0;padding:0}body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:15px}
button,input,textarea{font:inherit}button{cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:16px}
header{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--bd)}
.bar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;max-width:720px;margin:0 auto;gap:10px}
.brand{font-size:20px;font-weight:700;font-family:"Instrument Serif",serif}
.hright{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pct-txt{font-size:13px;font-weight:700;color:var(--mu)}
.icon-btn{width:36px;height:36px;border-radius:999px;border:none;background:transparent;color:var(--tx);display:flex;align-items:center;justify-content:center;font-size:16px}
.pbar-wrap{height:5px;background:var(--sf2);overflow:hidden}.pbar-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--wa),var(--ok));transition:width .25s}
.lookup-card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:16px;margin-top:16px;position:sticky;top:64px;z-index:25;box-shadow:0 8px 24px rgba(0,0,0,.05)}
.lang-pills{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.lang-pill{padding:8px 14px;border-radius:999px;border:1.5px solid var(--bd);background:var(--bg);color:var(--mu);font-size:13px;font-weight:600}.lang-pill.active{border-color:var(--pr);background:var(--pr);color:#fff}
.search-row{display:flex;gap:8px}.search-row input{flex:1;padding:13px 14px;border-radius:12px;border:1.5px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px}.search-row input:focus{outline:none;border-color:var(--pr)}
.lookup-btn{border:0;border-radius:12px;padding:13px 18px;background:var(--pr);color:#fff;font-weight:700;font-size:15px;min-width:92px}.lookup-btn:disabled{opacity:.5}
.result{display:none;margin-top:14px;padding:14px;border-radius:14px;background:var(--sf2);border:1px solid var(--bd)}.result.show{display:block}
.rword{font-size:32px;font-family:"Instrument Serif",serif;line-height:1.1}.rtrans{font-size:24px;color:var(--pr);margin-top:6px;font-family:"Instrument Serif",serif}
.grammar-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.g-tag{padding:5px 10px;border-radius:999px;border:1px solid var(--bd);background:var(--sf);font-size:12px;color:var(--mu)}.warn-tag{border-color:var(--wa);color:var(--wa)}
.alt-box{margin-top:10px;padding:10px;border-radius:12px;border:1px dashed var(--bd);background:var(--sf)}.alt-title{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin-bottom:6px}.alt-item{padding:7px 0;border-top:1px solid var(--bd)}.alt-item:first-child{border-top:0;padding-top:0}.alt-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.note-row{margin-top:10px}.note-row textarea{width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);resize:none;font-size:13px;height:50px}
.save-row{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}.save-btn{border:0;border-radius:11px;padding:11px 20px;background:var(--ok);color:#fff;font-weight:700}.discard-btn{border:1px solid var(--bd);border-radius:11px;padding:11px 14px;background:transparent;color:var(--mu)}
.tabs{display:flex;gap:4px;padding:4px;background:var(--sf2);border-radius:12px;margin-top:16px;border:1px solid var(--bd);position:sticky;top:175px;z-index:20}.tab{flex:1;padding:9px;border-radius:9px;border:0;background:transparent;color:var(--mu);font-weight:600;font-size:13px}.tab.active{background:var(--sf);color:var(--tx);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.tab-pane{display:none}.tab-pane.active{display:block;margin-top:14px}.date-group{font-size:11px;color:var(--mu);letter-spacing:.06em;text-transform:uppercase;margin:16px 0 6px;font-weight:600}.card-list{display:flex;flex-direction:column;gap:8px}
.fcard{border-radius:14px;border:1px solid var(--bd);background:var(--sf);overflow:hidden}.fcard.archived{opacity:.55;border-style:dashed}.fcard-front{padding:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;cursor:pointer}.fcard-word{font-size:21px;font-family:"Instrument Serif",serif;line-height:1.1}.fcard-grammar{font-size:12px;color:var(--mu);margin-top:3px}.fcard-badges{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}.score-badge{padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800}.arch-badge{padding:3px 7px;border-radius:999px;font-size:10px;font-weight:700;background:var(--sf2);color:var(--mu);border:1px solid var(--bd)}
.s0{background:#ead5e1;color:#a12c7b}.s1{background:#eadcc8;color:#9c5d00}.s2{background:#d7e2cf;color:#4d7f2a}.fcard-back{display:none;padding:12px 14px 14px;border-top:1px solid var(--bd);background:var(--sf2)}.fcard.open .fcard-back{display:block}.fcard-trans-main{font-size:20px;font-family:"Instrument Serif",serif;color:var(--pr);margin-bottom:8px}.fcard-lang{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--mu);margin-bottom:2px}.extra-trans{margin-top:10px;padding-top:10px;border-top:1px solid var(--bd)}.extra-trans-item{margin-bottom:6px}.extra-trans-item .lang-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--mu);display:block}.extra-trans-item .val{font-size:16px;font-family:"Instrument Serif",serif;color:var(--tx)}.reveal-btn{padding:6px 12px;border-radius:999px;border:1px solid var(--bd);background:var(--bg);color:var(--mu);font-size:12px;margin-top:6px}.fcard-note{font-size:12px;color:var(--mu);margin-top:6px;font-style:italic}.fcard-btns{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}.rate-btn{padding:7px 10px;border-radius:9px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:12px;font-weight:600}.arch-btn{padding:7px 10px;border-radius:9px;border:1px solid var(--bd);background:var(--bg);color:var(--mu);font-size:12px}.del-btn{padding:7px 10px;border-radius:9px;border:1px solid var(--bd);background:var(--bg);color:var(--er);font-size:12px}
.empty-msg{text-align:center;padding:32px;color:var(--mu);border:1px dashed var(--bd);border-radius:14px;font-size:14px;line-height:1.6}.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);align-items:center;justify-content:center;padding:16px;z-index:50}.overlay.show{display:flex}.study-box{width:min(480px,100%);background:var(--sf);border:1px solid var(--bd);border-radius:20px;padding:18px;max-height:90vh;overflow-y:auto}.study-card{border-radius:14px;border:1px solid var(--bd);background:var(--sf2);min-height:180px;padding:24px;text-align:center;cursor:pointer;margin:12px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}.study-card.revealed{background:color-mix(in srgb,var(--pr) 10%,var(--sf2))}.study-word{font-size:36px;font-family:"Instrument Serif",serif;line-height:1.1}.study-hint{font-size:13px;color:var(--mu)}.study-trans{display:none;font-size:26px;font-family:"Instrument Serif",serif;color:var(--pr)}.study-card.revealed .study-trans{display:block}.study-card.revealed .study-hint{display:none}.study-sub{font-size:12px;color:var(--mu);display:none}.study-card.revealed .study-sub{display:block}.study-btns{display:none;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px}.study-btns.show{display:flex}.study-btns button{border:0;border-radius:11px;padding:12px 20px;font-weight:700;color:#fff;font-size:14px}#againBtn{background:var(--er)}#goodBtn{background:var(--wa)}#easyBtn{background:var(--ok)}.arch-study-btn{border:1px solid var(--bd);border-radius:11px;padding:10px 16px;background:var(--sf);color:var(--mu);font-size:13px;margin-top:6px;width:100%}.study-nav{display:flex;gap:8px;justify-content:center;margin-top:8px}.snav-btn{padding:8px 14px;border-radius:9px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);font-size:13px}.manage-list{display:flex;flex-direction:column;gap:8px;max-width:320px}.menu-btn{padding:11px 14px;border-radius:11px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);text-align:left;font-size:14px}.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}.stat{padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--sf);text-align:center}.stat .n{font-size:24px;font-weight:700}.stat .l{font-size:11px;color:var(--mu);margin-top:2px}
@media(max-width:560px){.tabs{top:164px}.lookup-card{top:56px}.study-word{font-size:30px}.study-trans{font-size:22px}.rword{font-size:26px}}
</style>
</head>
<body>
<header><div class="bar"><div class="brand">LexiCard German</div><div class="hright"><div class="pct-txt" id="pctLabel">0%</div><button class="icon-btn" id="studyOpenBtn" title="Study mode">▶</button><button class="icon-btn" id="themeBtn" title="Toggle theme">◐</button></div></div><div class="pbar-wrap"><div class="pbar-fill" id="pbar"></div></div></header>
<div class="wrap">
  <div class="lookup-card">
    <div class="lang-pills"><button class="lang-pill active" data-lang="en">English</button><button class="lang-pill" data-lang="ru">Russian</button><button class="lang-pill" data-lang="hy">Armenian</button></div>
    <div class="search-row"><input id="wordInput" type="text" placeholder="Type German word…" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false"><button class="lookup-btn" id="lookupBtn">Look up</button></div>
    <div class="result" id="resultBox"><div class="rword" id="rWord"></div><div class="rtrans" id="rTrans"></div><div class="grammar-row" id="grammarRow"></div><div class="alt-box" id="altBox" style="display:none"></div><div class="note-row"><textarea id="noteInput" placeholder="Optional note: e.g. 'from Chapter 3', 'saw on a sign'"></textarea></div><div class="save-row"><button class="save-btn" id="saveBtn">Save flashcard</button><button class="discard-btn" id="discardBtn">Discard</button><span class="dup-msg" id="dupMsg" style="display:none">Already saved — will update.</span></div></div>
  </div>
  <div class="tabs"><button class="tab active" data-tab="today">Today <span id="todayCount"></span></button><button class="tab" data-tab="all">Active <span id="allCount"></span></button><button class="tab" data-tab="archive">Archive <span id="archCount"></span></button><button class="tab" data-tab="manage">⚙</button></div>
  <div id="pane-today" class="tab-pane active"></div><div id="pane-all" class="tab-pane"></div><div id="pane-archive" class="tab-pane"></div>
  <div id="pane-manage" class="tab-pane"><div class="stat-row"><div class="stat"><div class="n" id="statActive">0</div><div class="l">Active</div></div><div class="stat"><div class="n" id="statArch">0</div><div class="l">Archived</div></div><div class="stat"><div class="n" id="statPct">0%</div><div class="l">Learned</div></div></div><div class="manage-list"><button class="menu-btn" id="exportBtn">⬇ Export deck (JSON)</button><label class="menu-btn" for="importInput" style="cursor:pointer">⬆ Import deck (JSON)</label><input type="file" id="importInput" accept="application/json" style="display:none"><button class="menu-btn" id="clearBtn" style="color:var(--er)">✕ Clear all cards</button></div><p style="font-size:12px;color:var(--mu);margin-top:16px">Cards are stored only in this browser.<br>Export regularly to keep a backup.</p></div>
</div>
<div class="overlay" id="studyOverlay"><div class="study-box"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><div style="font-size:13px;color:var(--mu)" id="studyProg"></div><div style="font-size:11px;color:var(--mu)" id="studyQueue"></div><button class="snav-btn" id="closeStudy">Close</button></div><div class="study-card" id="studyCard"><div class="study-word" id="sWord"></div><div id="sGrammar" class="grammar-row" style="justify-content:center;margin-top:0"></div><div class="study-hint">tap to reveal</div><div class="study-trans" id="sTrans"></div><div class="study-sub" id="sSub"></div></div><div class="study-btns" id="studyBtns"><button id="againBtn">Again</button><button id="goodBtn">Good</button><button id="easyBtn">Easy</button></div><button class="arch-study-btn" id="archFromStudyBtn" style="display:none">📦 Archive this word (I know it)</button><div class="study-nav"><button class="snav-btn" id="prevBtn">← Prev</button><button class="snav-btn" id="nextBtn">Skip →</button></div></div></div>
<script>
var STORAGE_KEY='lexicard_v12';
var LANGS={en:'English',ru:'Russian',hy:'Armenian'};
var OTHER={en:['ru','hy'],ru:['en','hy'],hy:['en','ru']};
var cards=[],preview=null,studyIdx=0,studyQueue=[],currentLang='en';
try{cards=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]')}catch(e){cards=[]}
function persist(){localStorage.setItem(STORAGE_KEY,JSON.stringify(cards))}
function today(){return new Date().toISOString().slice(0,10)}
function fmtDate(d){var t=today(),diff=Math.round((new Date(t)-new Date(d))/86400000);if(d===t)return'Today';if(diff===1)return'Yesterday';if(diff<7)return diff+' days ago';return new Date(d+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'})}
function activePct(){var a=cards.filter(c=>!c.archived);if(!a.length)return 0;return Math.round(a.reduce((x,c)=>x+(c.score||0),0)/(a.length*2)*100)}
function syncHeader(){var a=cards.filter(c=>!c.archived),arch=cards.filter(c=>c.archived),p=activePct();document.getElementById('pctLabel').textContent=p+'%';document.getElementById('pbar').style.width=p+'%';document.getElementById('todayCount').textContent='('+cards.filter(c=>c.savedOn===today()&&!c.archived).length+')';document.getElementById('allCount').textContent='('+a.length+')';document.getElementById('archCount').textContent='('+arch.length+')';document.getElementById('statActive').textContent=a.length;document.getElementById('statArch').textContent=arch.length;document.getElementById('statPct').textContent=p+'%'}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function badgeCls(s){return s>=2?'s2':s===1?'s1':'s0'}
function badgeLbl(s){return s>=2?'Learned':s===1?'Learning':'New'}
(function(){var html=document.documentElement;html.setAttribute('data-theme',window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.getElementById('themeBtn').addEventListener('click',function(){html.setAttribute('data-theme',html.getAttribute('data-theme')==='dark'?'light':'dark')})})();
document.querySelectorAll('.lang-pill').forEach(function(pill){pill.addEventListener('click',function(){document.querySelectorAll('.lang-pill').forEach(function(p){p.classList.remove('active')});pill.classList.add('active');currentLang=pill.dataset.lang;if(document.getElementById('wordInput').value.trim()&&document.getElementById('resultBox').classList.contains('show'))doLookup()})});
function translate(word,tl){var url='https://translate.googleapis.com/translate_a/single?client=gtx&sl=de&tl='+tl+'&dt=t&q='+encodeURIComponent(word);return fetch(url).then(function(r){if(!r.ok)throw new Error();return r.json()}).then(function(d){return d[0].map(function(s){return s[0]}).join('')})}
function fetchSources(word){var nounUrl='https://r.jina.ai/https://www.verbformen.com/declension/nouns/'+encodeURIComponent(word)+'.htm';var verbUrl='https://r.jina.ai/https://www.verbformen.com/conjugation/'+encodeURIComponent(word)+'.htm';var wikiUrl='https://r.jina.ai/https://en.wiktionary.org/wiki/'+encodeURIComponent(word);return Promise.allSettled([fetch(nounUrl).then(function(r){return r.ok?r.text():''}),fetch(verbUrl).then(function(r){return r.ok?r.text():''}),fetch(wikiUrl).then(function(r){return r.ok?r.text():''})])}
function parseVerb(text){var g={infinitive:'',preterite:'',participle:''};var inf=text.match(/Infinitiv[^:\n]*:\s*([^\n]+)/i)||text.match(/Grundform[^:\n]*:\s*([^\n]+)/i);var prt=text.match(/Präteritum[^:\n]*:\s*([^\n]+)/i)||text.match(/Praeteritum[^:\n]*:\s*([^\n]+)/i);var ppp=text.match(/Partizip II[^:\n]*:\s*([^\n]+)/i)||text.match(/Partizip Perfekt[^:\n]*:\s*([^\n]+)/i);if(inf)g.infinitive=inf[1].trim().split(/[\s,]+/)[0];if(prt)g.preterite=prt[1].trim().split(/[\s,]+/)[0];if(ppp)g.participle=ppp[1].trim().split(/[\s,]+/)[0];return g}
function parseNoun(text){var g={gender:'',article:'',plural:''};if(/Feminin/i.test(text)||/feminine/i.test(text))g.gender='feminine';else if(/Maskulin/i.test(text)||/masculine/i.test(text))g.gender='masculine';else if(/Neutrum/i.test(text)||/neutral/i.test(text))g.gender='neutral';var am=text.match(/\b(die|der|das)\b/i);if(am)g.article=am[1].toLowerCase();var pm=text.match(/Plural[^:\n]*:\s*([^\n]+)/i)||text.match(/Mehrzahl[^:\n]*:\s*([^\n]+)/i);if(pm)g.plural=pm[1].trim().split(/[\s,]+/)[0];return g}
function resolveGrammar(word,text){var t=(text||'').toLowerCase();var out={pos:'',gender:'',plural:'',article:'',infinitive:'',preterite:'',participle:'',source:''};var adj=/\badjektiv\b|\bpartizip\b|\bgeneigt\b|\binclined\b/.test(t);var verb=/\bkonjugation\b|\bverb\b/.test(t);var noun=/\bdeklination\b|\bsubstantiv\b|\bnoun\b/.test(t);if(adj){out.pos='Adjektiv';out.source='adj';return out}if(noun&&!verb){out.pos='Substantiv';Object.assign(out,parseNoun(text));out.source='noun';return out}if(verb&&!noun){out.pos='Verb';Object.assign(out,parseVerb(text));out.source='verb';return out}if(noun&&verb){out.pos='Verb';Object.assign(out,parseVerb(text));out.source='ambiguous';out.altNoun=parseNoun(text);return out}return out}
function renderGrammarTags(g,el){var tags=[];if(g.pos)tags.push('<span class="g-tag"><b>'+esc(g.pos)+'</b></span>');if(g.pos==='Substantiv'){if(g.article)tags.push('<span class="g-tag">'+esc(g.article)+'</span>');if(g.gender)tags.push('<span class="g-tag">'+esc(g.gender)+'</span>');if(g.plural)tags.push('<span class="g-tag">pl: <b>'+esc(g.plural)+'</b></span>')}if(g.pos==='Verb'){if(g.infinitive)tags.push('<span class="g-tag">inf: <b>'+esc(g.infinitive)+'</b></span>');if(g.preterite)tags.push('<span class="g-tag">pret: <b>'+esc(g.preterite)+'</b></span>');if(g.participle)tags.push('<span class="g-tag">pp: <b>'+esc(g.participle)+'</b></span>')}if(g.pos==='Adjektiv'){tags.push('<span class="g-tag">no article</span>');tags.push('<span class="g-tag">adjective-like</span>')}if(!g.pos)tags.push('<span class="g-tag warn-tag">needs review</span>');el.innerHTML=tags.join('')}
function detectAmbiguous(word,nounText,verbText){var alts=[];var nounGuess=resolveGrammar(word,nounText||'');var verbGuess=resolveGrammar(word,verbText||'');if(nounGuess.pos==='Substantiv'){alts.push({title:'noun reading',items:[(nounGuess.article||'das')+' '+word,(nounGuess.gender||'noun')+(nounGuess.plural?' · pl: '+nounGuess.plural:'')]})}if(verbGuess.pos==='Verb'){alts.push({title:'verb reading',items:[verbGuess.infinitive?('inf: '+verbGuess.infinitive):('inf: '+word),verbGuess.preterite?('pret: '+verbGuess.preterite):'',verbGuess.participle?('pp: '+verbGuess.participle):''].filter(Boolean)})}if((word||'').toLowerCase()==='vernehmen'){alts.unshift({title:'verb first',items:['treat as verb','noun form optional']})}if((word||'').toLowerCase()==='geneigt'){alts.unshift({title:'adjective reading',items:['keep as adjective','no article']})}return alts}
function doLookup(){var word=document.getElementById('wordInput').value.trim();if(!word)return;var btn=document.getElementById('lookupBtn');btn.disabled=true;btn.textContent='Loading…';document.getElementById('resultBox').classList.remove('show');document.getElementById('altBox').style.display='none';translate(word,currentLang).then(function(tr){return fetchSources(word).then(function(src){return {tr:tr,src:src}})}).then(function(res){var tr=res.tr,src=res.src,nounText=src[0].status==='fulfilled'?src[0].value:'',verbText=src[1].status==='fulfilled'?src[1].value:'',wik=src[2].status==='fulfilled'?src[2].value:'';var nounGuess=resolveGrammar(word,nounText||wik),verbGuess=resolveGrammar(word,verbText),g=verbGuess.pos==='Verb'?verbGuess:(nounGuess.pos==='Substantiv'?nounGuess:resolveGrammar(word,wik));preview={word:word,translation:tr,targetLang:currentLang,grammar:g,savedOn:today(),extraTranslations:{}};document.getElementById('rWord').textContent=(g.pos==='Substantiv'&&g.article?g.article+' ':'')+word;document.getElementById('rTrans').textContent=tr;renderGrammarTags(g,document.getElementById('grammarRow'));var alts=detectAmbiguous(word,nounText,verbText);if(alts.length){var box='<div class="alt-title">possible versions</div>';alts.forEach(function(a){box+='<div class="alt-item"><b>'+esc(a.title)+'</b><div class="alt-badges">'+a.items.map(function(i){return '<span class="g-tag">'+esc(i)+'</span>'}).join('')+'</div></div>'});document.getElementById('altBox').innerHTML=box;document.getElementById('altBox').style.display='block'}document.getElementById('dupMsg').style.display=cards.some(function(c){return c.word.toLowerCase()===word.toLowerCase()})?'inline':'none';document.getElementById('resultBox').classList.add('show')}).catch(function(){document.getElementById('rWord').textContent='Lookup failed';document.getElementById('rTrans').textContent='Please try again.';document.getElementById('resultBox').classList.add('show')}).finally(function(){btn.disabled=false;btn.textContent='Look up'})}
function buildCardHTML(c,ci){var g=c.grammar||{},gramLine=g.pos==='Substantiv'?[g.pos,g.article||'',g.gender,g.plural?'pl:'+g.plural:''].filter(Boolean).join(' · '):g.pos==='Verb'?[g.pos,g.infinitive?'inf:'+g.infinitive:'',g.preterite?'pret:'+g.preterite:'',g.participle?'pp:'+g.participle:''].filter(Boolean).join(' · '):[g.pos].filter(Boolean).join(' · '),extraHtml='',others=OTHER[c.targetLang]||['ru','hy'];others.forEach(function(l){var cached=(c.extraTranslations||{})[l];if(cached){extraHtml+='<div class="extra-trans-item"><span class="lang-lbl">'+LANGS[l]+'</span><span class="val">'+esc(cached)+'</span></div>'}else{extraHtml+='<button class="reveal-btn" data-ci="'+ci+'" data-lang="'+l+'" data-action="reveal">Show '+LANGS[l]+'</button>'}});return '<div class="fcard'+(c.archived?' archived':'')+'" data-ci="'+ci+'"><div class="fcard-front"><div><div class="fcard-word">'+esc(g.article?g.article+' ':'')+esc(c.word)+'</div>'+(gramLine?'<div class="fcard-grammar">'+esc(gramLine)+'</div>':'')+'</div><div class="fcard-badges"><div class="score-badge '+badgeCls(c.score||0)+'">'+badgeLbl(c.score||0)+'</div>'+(c.archived?'<div class="arch-badge">Archived</div>':'')+'</div></div><div class="fcard-back"><div class="fcard-lang">'+esc(LANGS[c.targetLang]||c.targetLang)+'</div><div class="fcard-trans-main">'+esc(c.translation)+'</div><div class="extra-trans">'+extraHtml+'</div>'+(c.note?'<div class="fcard-note">'+esc(c.note)+'</div>':'')+'<div class="fcard-btns">'+(!c.archived?'<button class="rate-btn" data-ci="'+ci+'" data-v="0" data-action="rate">Again</button><button class="rate-btn" data-ci="'+ci+'" data-v="1" data-action="rate">Good</button><button class="rate-btn" data-ci="'+ci+'" data-v="2" data-action="rate">Easy</button>':'')+'<button class="arch-btn" data-ci="'+ci+'" data-action="archive">'+(c.archived?'Unarchive':'📦 Archive')+'</button><button class="del-btn" data-ci="'+ci+'" data-action="del">Delete</button></div></div></div>'}
function attachCardEvents(el){el.querySelectorAll('.fcard-front').forEach(function(front){front.addEventListener('click',function(e){if(e.target.closest('[data-action]'))return;front.closest('.fcard').classList.toggle('open')})});el.querySelectorAll('[data-action]').forEach(function(btn){btn.addEventListener('click',function(e){e.stopPropagation();var ci=parseInt(btn.dataset.ci),action=btn.dataset.action;if(action==='rate'){cards[ci].score=parseInt(btn.dataset.v);cards[ci].reviewCount=(cards[ci].reviewCount||0)+1;cards[ci].lastReviewed=new Date().toISOString();persist();renderAll()}else if(action==='archive'){cards[ci].archived=!cards[ci].archived;persist();renderAll()}else if(action==='del'){if(confirm('Delete "'+cards[ci].word+'" permanently?')){cards.splice(ci,1);persist();renderAll()}}else if(action==='reveal'){var lang=btn.dataset.lang;btn.textContent='Loading…';btn.disabled=true;translate(cards[ci].word,lang).then(function(t){if(!cards[ci].extraTranslations)cards[ci].extraTranslations={};cards[ci].extraTranslations[lang]=t;persist();renderAll()}).catch(function(){btn.textContent='Failed — tap retry';btn.disabled=false})}})})}
function renderAll(){syncHeader();renderPane('today');renderPane('all');renderPane('archive')}
function renderPane(tab){var el=document.getElementById('pane-'+tab),list=tab==='today'?cards.filter(function(c){return c.savedOn===today()&&!c.archived}):tab==='all'?cards.filter(function(c){return !c.archived}):cards.filter(function(c){return c.archived});if(!list.length){var msgs={today:'No words saved today yet.<br>Look up a German word above.',all:'No active cards.',archive:'No archived words yet.<br>Archive a card when you have fully learned it.'};el.innerHTML='<div class="empty-msg">'+msgs[tab]+'</div>';return}var groups={};list.forEach(function(c){var d=c.savedOn||'older';(groups[d]=groups[d]||[]).push(c)});var html='';Object.keys(groups).sort(function(a,b){return b.localeCompare(a)}).forEach(function(d){if(tab!=='today')html+='<div class="date-group">'+fmtDate(d)+'</div>';html+='<div class="card-list">';groups[d].forEach(function(c){html+=buildCardHTML(c,cards.indexOf(c))});html+='</div>'});el.innerHTML=html;attachCardEvents(el)}
function buildQueue(){function score(c){return (c.score||0)*10+(c.lastReviewed?1:0)}var active=cards.filter(function(c){return !c.archived});return active.filter(function(c){return c.savedOn===today()}).sort(function(a,b){return score(a)-score(b)}).concat(active.filter(function(c){return c.savedOn!==today()}).sort(function(a,b){return score(a)-score(b)}))}
function loadStudyCard(){var c=studyQueue[studyIdx],card=document.getElementById('studyCard'),g=c.grammar||{};card.classList.remove('revealed');document.getElementById('studyBtns').classList.remove('show');document.getElementById('archFromStudyBtn').style.display='none';document.getElementById('studyProg').textContent=(studyIdx+1)+' / '+studyQueue.length;document.getElementById('sWord').textContent=(g.article?g.article+' ':'')+c.word;renderGrammarTags(g,document.getElementById('sGrammar'));document.getElementById('sTrans').textContent=c.translation;document.getElementById('sSub').textContent=g.pos==='Verb'?[g.infinitive?'inf: '+g.infinitive:'',g.preterite?'pret: '+g.preterite:'',g.participle?'pp: '+g.participle:''].filter(Boolean).join(' · '):(LANGS[c.targetLang]||c.targetLang)+(c.note?' · '+c.note:'');document.getElementById('nextBtn').textContent=studyIdx===studyQueue.length-1?'Finish':'Skip →'}
function rateStudy(v){var c=studyQueue[studyIdx],i=cards.indexOf(c);if(i>=0){cards[i].score=v;cards[i].reviewCount=(cards[i].reviewCount||0)+1;cards[i].lastReviewed=new Date().toISOString();persist();renderAll()}if(studyIdx<studyQueue.length-1){studyIdx++;loadStudyCard()}else document.getElementById('studyOverlay').classList.remove('show')}
(function(){document.getElementById('lookupBtn').addEventListener('click',doLookup);document.getElementById('wordInput').addEventListener('keydown',function(e){if(e.key==='Enter')doLookup()});document.querySelectorAll('.tab').forEach(function(tab){tab.addEventListener('click',function(){document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});document.querySelectorAll('.tab-pane').forEach(function(p){p.classList.remove('active')});tab.classList.add('active');document.getElementById('pane-'+tab.dataset.tab).classList.add('active')})});document.getElementById('studyOpenBtn').addEventListener('click',function(){var active=cards.filter(function(c){return !c.archived});if(!active.length){alert('No active cards to study. Add some words first.');return}studyQueue=buildQueue();studyIdx=0;document.getElementById('studyQueue').textContent='Today: '+cards.filter(function(c){return c.savedOn===today()&&!c.archived}).length;loadStudyCard();document.getElementById('studyOverlay').classList.add('show')});document.getElementById('closeStudy').addEventListener('click',function(){document.getElementById('studyOverlay').classList.remove('show')});document.getElementById('studyOverlay').addEventListener('click',function(e){if(e.target===this)this.classList.remove('show')});document.getElementById('studyCard').addEventListener('click',function(){var card=document.getElementById('studyCard');if(card.classList.contains('revealed'))return;card.classList.add('revealed');document.getElementById('studyBtns').classList.add('show');document.getElementById('archFromStudyBtn').style.display='block'});document.getElementById('prevBtn').addEventListener('click',function(){if(studyIdx>0){studyIdx--;loadStudyCard()}});document.getElementById('nextBtn').addEventListener('click',function(){if(studyIdx<studyQueue.length-1){studyIdx++;loadStudyCard()}else document.getElementById('studyOverlay').classList.remove('show')});document.getElementById('againBtn').addEventListener('click',function(){rateStudy(0)});document.getElementById('goodBtn').addEventListener('click',function(){rateStudy(1)});document.getElementById('easyBtn').addEventListener('click',function(){rateStudy(2)});document.getElementById('archFromStudyBtn').addEventListener('click',function(){var c=studyQueue[studyIdx],i=cards.indexOf(c);if(i>=0){cards[i].archived=true;persist();renderAll()}if(studyIdx<studyQueue.length-1){studyIdx++;loadStudyCard()}else document.getElementById('studyOverlay').classList.remove('show')});document.getElementById('saveBtn').addEventListener('click',function(){if(!preview)return;var note=document.getElementById('noteInput').value.trim(),idx=cards.findIndex(function(c){return c.word.toLowerCase()===preview.word.toLowerCase()}),card={id:idx>=0?cards[idx].id:Date.now(),word:preview.word,translation:preview.translation,targetLang:preview.targetLang,grammar:preview.grammar,note:note,savedOn:preview.savedOn,score:idx>=0?cards[idx].score:0,reviewCount:idx>=0?cards[idx].reviewCount:0,lastReviewed:idx>=0?cards[idx].lastReviewed:null,archived:false,extraTranslations:(idx>=0&&cards[idx].extraTranslations)?cards[idx].extraTranslations:{}};if(idx>=0)cards[idx]=card;else cards.unshift(card);persist();renderAll();document.getElementById('resultBox').classList.remove('show');document.getElementById('wordInput').value='';preview=null});document.getElementById('discardBtn').addEventListener('click',function(){document.getElementById('resultBox').classList.remove('show');preview=null});document.getElementById('exportBtn').addEventListener('click',function(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(cards,null,2)],{type:'application/json'}));a.download='lexicard-deck.json';a.click();URL.revokeObjectURL(a.href)});document.getElementById('importInput').addEventListener('change',function(e){var f=e.target.files[0];if(!f)return;f.text().then(function(t){var d=JSON.parse(t);if(!Array.isArray(d))throw 0;cards=d.map(function(c){return Object.assign({archived:false,extraTranslations:{}},c)});persist();renderAll();alert('Deck imported.')}).catch(function(){alert('Import failed.')})});document.getElementById('clearBtn').addEventListener('click',function(){if(confirm('Delete ALL flashcards including archive?')){cards=[];persist();renderAll()}});document.getElementById('themeBtn').addEventListener('click',function(){document.documentElement.setAttribute('data-theme',document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark')});renderAll()})();

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LexiCard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f7f6f2;color:#222;font-size:15px}
button,input,textarea{font:inherit;cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:16px}

/* Header */
header{position:sticky;top:0;z-index:20;background:#f7f6f2;border-bottom:1px solid #d6d1c8;padding:12px 16px}
.brand{font-size:20px;font-weight:700}

/* Lookup */
.lookup{background:#fff;border:1px solid #d6d1c8;border-radius:14px;padding:16px;margin-top:14px}
.lang-row{display:flex;gap:6px;margin-bottom:12px}
.lang-btn{padding:7px 14px;border-radius:999px;border:1.5px solid #d6d1c8;background:#f7f6f2;color:#76736d;font-weight:600;font-size:13px}
.lang-btn.active{background:#0f6c72;border-color:#0f6c72;color:#fff}
.search-row{display:flex;gap:8px}
.search-row input{flex:1;padding:12px 14px;border:1.5px solid #d6d1c8;border-radius:10px;background:#f7f6f2}
.search-row input:focus{outline:none;border-color:#0f6c72}
.lookup-btn{padding:12px 18px;border:0;border-radius:10px;background:#0f6c72;color:#fff;font-weight:700}
.lookup-btn:disabled{opacity:.5}

/* Result */
.result{display:none;margin-top:14px;padding:14px;background:#f7f6f2;border:1px solid #d6d1c8;border-radius:12px}
.result.show{display:block}
.r-word{font-size:30px;font-weight:700;line-height:1.2}
.r-trans{font-size:22px;color:#0f6c72;margin-top:6px}
.r-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{padding:5px 10px;border-radius:999px;background:#fff;border:1px solid #d6d1c8;font-size:12px;color:#444}
.tag.warn{border-color:#9c5d00;color:#9c5d00}
.secondary{margin-top:10px}
.secondary summary{font-size:13px;color:#76736d;cursor:pointer;padding:6px 0}
.secondary-body{font-size:13px;color:#555;padding:6px 0 2px 10px}
textarea.note{width:100%;margin-top:12px;padding:10px;border:1px solid #d6d1c8;border-radius:10px;background:#fff;resize:none;height:56px}
.save-row{display:flex;gap:8px;margin-top:10px;align-items:center}
.save-btn{padding:11px 20px;border:0;border-radius:10px;background:#4d7f2a;color:#fff;font-weight:700}
.discard-btn{padding:11px 14px;border:1px solid #d6d1c8;border-radius:10px;background:#fff;color:#76736d}
.dup-note{font-size:12px;color:#9c5d00}

/* Tabs */
.tabs{display:flex;gap:4px;margin-top:14px;background:#f1eee9;border:1px solid #d6d1c8;border-radius:12px;padding:4px}
.tab{flex:1;padding:10px;border:0;border-radius:9px;background:transparent;font-weight:600;font-size:13px;color:#76736d}
.tab.active{background:#fff;color:#222}

/* Card list */
.pane{display:none;margin-top:12px}
.pane.active{display:block}
.card-list{display:flex;flex-direction:column;gap:8px}
.fc{background:#fff;border:1px solid #d6d1c8;border-radius:12px;overflow:hidden}
.fc-front{display:flex;justify-content:space-between;align-items:flex-start;padding:13px;cursor:pointer;gap:10px}
.fc-word{font-size:20px;font-weight:700}
.fc-gl{font-size:12px;color:#76736d;margin-top:3px}
.fc-badge{padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700}
.b0{background:#ead5e1;color:#a12c7b}
.b1{background:#eadcc8;color:#9c5d00}
.b2{background:#d7e2cf;color:#4d7f2a}
.fc-back{display:none;padding:12px 13px 14px;border-top:1px solid #d6d1c8;background:#f7f6f2}
.fc.open .fc-back{display:block}
.fc-trans{font-size:20px;color:#0f6c72;margin-bottom:8px}
.fc-note{font-size:12px;color:#76736d;font-style:italic;margin-top:6px}
.btn-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.rate-btn{padding:7px 11px;border-radius:9px;border:1px solid #d6d1c8;background:#f7f6f2;font-size:12px;font-weight:600}
.arch-btn{padding:7px 11px;border-radius:9px;border:1px solid #d6d1c8;background:#f7f6f2;font-size:12px;color:#76736d}
.del-btn{padding:7px 11px;border-radius:9px;border:1px solid #d6d1c8;background:#f7f6f2;font-size:12px;color:#a12c7b}
.empty{text-align:center;padding:30px;color:#76736d;border:1px dashed #d6d1c8;border-radius:12px;font-size:14px;line-height:1.7}
</style>
</head>
<body>
<header><div class="wrap"><div class="brand">LexiCard</div></div></header>
<div class="wrap">

  <!-- Lookup card -->
  <div class="lookup">
    <div class="lang-row">
      <button class="lang-btn active" data-lang="en">English</button>
      <button class="lang-btn" data-lang="ru">Russian</button>
      <button class="lang-btn" data-lang="hy">Armenian</button>
    </div>
    <div class="search-row">
      <input id="wordInput" placeholder="Type German word..." autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
      <button class="lookup-btn" id="lookupBtn">Look up</button>
    </div>
    <div class="result" id="resultBox">
      <div class="r-word" id="rWord"></div>
      <div class="r-trans" id="rTrans"></div>
      <div class="r-tags" id="rTags"></div>
      <div class="secondary" id="rSecondary"></div>
      <textarea class="note" id="noteInput" placeholder="Optional note..."></textarea>
      <div class="save-row">
        <button class="save-btn" id="saveBtn">Save card</button>
        <button class="discard-btn" id="discardBtn">Discard</button>
        <span class="dup-note" id="dupNote" style="display:none">Already saved — will update.</span>
      </div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" data-tab="today">Today</button>
    <button class="tab" data-tab="all">Active</button>
    <button class="tab" data-tab="archive">Archive</button>
  </div>
  <div class="pane active" id="pane-today"></div>
  <div class="pane" id="pane-all"></div>
  <div class="pane" id="pane-archive"></div>

</div>
<script>
// ── Storage ──────────────────────────────────────────────
var STORE_KEY = 'lexicard_v14';
var cards = [];
var preview = null;
var currentLang = 'en';

try { cards = JSON.parse(localStorage.getItem(STORE_KEY) || '[]'); } catch(e) { cards = []; }
function save() { localStorage.setItem(STORE_KEY, JSON.stringify(cards)); }
function todayStr() { return new Date().toISOString().slice(0, 10); }
function esc(s) { return String(s || '').replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }

// ── Language pills ────────────────────────────────────────
document.querySelectorAll('.lang-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.lang-btn').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    currentLang = btn.dataset.lang;
  });
});

// ── Tabs ──────────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(function(tab) {
  tab.addEventListener('click', function() {
    document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
    document.querySelectorAll('.pane').forEach(function(p){ p.classList.remove('active'); });
    tab.classList.add('active');
    document.getElementById('pane-' + tab.dataset.tab).classList.add('active');
  });
});

// ── Translation via Google ────────────────────────────────
function translate(word, lang) {
  var url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=de&tl=' + lang + '&dt=t&q=' + encodeURIComponent(word);
  return fetch(url).then(function(r){ return r.json(); }).then(function(d){ return d[0].map(function(x){ return x[0]; }).join(''); });
}

// ── Grammar sources ───────────────────────────────────────
function fetchPons(word) {
  var url = 'https://r.jina.ai/https://en.pons.com/translate/german-english/' + encodeURIComponent(word);
  return fetch(url).then(function(r){ return r.ok ? r.text() : ''; }).catch(function(){ return ''; });
}
function fetchWiki(word) {
  var url = 'https://r.jina.ai/https://en.wiktionary.org/wiki/' + encodeURIComponent(word);
  return fetch(url).then(function(r){ return r.ok ? r.text() : ''; }).catch(function(){ return ''; });
}

// ── Grammar parsing ───────────────────────────────────────
function parsePons(text) {
  var t = text || '';
  var low = t.toLowerCase();
  var g = { pos: '', article: '', gender: '', plural: '', source: 'pons' };

  // Part of speech — look for explicit PONS labels
  if (/\bN m\b|\bN f\b|\bN n\b/i.test(t)) g.pos = 'Substantiv';
  else if (/\bV \b|\bVT\b|\bVI\b|\bverb\b/i.test(t)) g.pos = 'Verb';
  else if (/\bADJ\b|\badjective\b/i.test(low)) g.pos = 'Adjektiv';

  // Article and gender
  if (/\bN m\b/i.test(t)) { g.gender = 'masculine'; g.article = 'der'; }
  if (/\bN f\b/i.test(t)) { g.gender = 'feminine';  g.article = 'die'; }
  if (/\bN n\b/i.test(t)) { g.gender = 'neutral';   g.article = 'das'; }

  // Plural
  var pm = t.match(/plural[^\n:]*?:\s*([^\n]+)/i);
  if (pm) g.plural = pm[1].trim().split(/[;,\s]/)[0];

  return g;
}

function parseWiki(text) {
  var low = (text || '').toLowerCase();
  var g = { pos: '', article: '', gender: '', source: 'wiki' };
  if (/===\s*noun/.test(low))      g.pos = 'Substantiv';
  else if (/===\s*verb/.test(low)) g.pos = 'Verb';
  else if (/===\s*adj/.test(low))  g.pos = 'Adjektiv';
  if (/gender=m/.test(low)) { g.gender = 'masculine'; g.article = 'der'; }
  if (/gender=f/.test(low)) { g.gender = 'feminine';  g.article = 'die'; }
  if (/gender=n/.test(low)) { g.gender = 'neutral';   g.article = 'das'; }
  return g;
}

function resolveGrammar(word, ponsText, wikiText) {
  // 1. Try PONS first
  var p = parsePons(ponsText);
  if (p.pos) return p;
  // 2. Fallback: Wiktionary
  var w = parseWiki(wikiText);
  if (w.pos) return w;
  // 3. Last resort: capitalization
  if (/^[A-ZÄÖÜ]/.test(word)) return { pos: 'Substantiv', article: '', gender: '', plural: '', source: 'caps' };
  return { pos: '', source: 'unknown' };
}

function getSecondary(g, ponsText, wikiText) {
  var combined = ((ponsText || '') + ' ' + (wikiText || '')).toLowerCase();
  var alts = [];
  if (g.pos === 'Verb' && /\bn m\b|\bn f\b|\bn n\b|noun/.test(combined))
    alts.push({ title: 'Also has a noun form', text: 'This word can be used as a noun. Tap for more.' });
  if (g.pos === 'Substantiv' && /\bv \b|\bvt\b|\bvi\b|verb/.test(combined))
    alts.push({ title: 'Also has a verb form', text: 'This word can be used as a verb. Tap for more.' });
  return alts;
}

function grammarLine(g) {
  if (g.pos === 'Substantiv') {
    return ['Substantiv', g.article, g.gender, g.plural ? 'pl: ' + g.plural : ''].filter(Boolean).join(' · ');
  }
  if (g.pos === 'Verb') return 'Verb';
  if (g.pos === 'Adjektiv') return 'Adjektiv';
  return 'needs review';
}

// ── Render result ─────────────────────────────────────────
function renderResult(word, translation, g, secondary) {
  var displayWord = (g.pos === 'Substantiv' && g.article) ? g.article + ' ' + word : word;
  document.getElementById('rWord').textContent = displayWord;
  document.getElementById('rTrans').textContent = translation;
  var tagsEl = document.getElementById('rTags');
  tagsEl.innerHTML = '<span class="tag">' + esc(grammarLine(g)) + '</span>';
  if (g.source === 'caps' || g.source === 'unknown') {
    tagsEl.innerHTML += '<span class="tag warn">grammar not confirmed</span>';
  }
  var secEl = document.getElementById('rSecondary');
  if (secondary && secondary.length) {
    secEl.innerHTML = secondary.map(function(s) {
      return '<details class="secondary"><summary>' + esc(s.title) + '</summary><div class="secondary-body">' + esc(s.text) + '</div></details>';
    }).join('');
  } else {
    secEl.innerHTML = '';
  }
  document.getElementById('dupNote').style.display = cards.some(function(c){ return c.word.toLowerCase() === word.toLowerCase(); }) ? 'inline' : 'none';
  document.getElementById('noteInput').value = '';
  document.getElementById('resultBox').classList.add('show');
}

// ── Lookup ────────────────────────────────────────────────
function doLookup() {
  var word = document.getElementById('wordInput').value.trim();
  if (!word) return;
  var btn = document.getElementById('lookupBtn');
  btn.disabled = true;
  btn.textContent = 'Loading…';
  document.getElementById('resultBox').classList.remove('show');

  var ponsText = '', wikiText = '';

  translate(word, currentLang)
    .then(function(tr) {
      return Promise.allSettled([fetchPons(word), fetchWiki(word)])
        .then(function(results) {
          ponsText = results[0].status === 'fulfilled' ? results[0].value : '';
          wikiText = results[1].status === 'fulfilled' ? results[1].value : '';
          var g = resolveGrammar(word, ponsText, wikiText);
          var secondary = getSecondary(g, ponsText, wikiText);
          preview = { word: word, translation: tr, targetLang: currentLang, grammar: g, secondary: secondary };
          renderResult(word, tr, g, secondary);
        });
    })
    .catch(function() {
      document.getElementById('rWord').textContent = 'Lookup failed';
      document.getElementById('rTrans').textContent = 'Please try again.';
      document.getElementById('rTags').innerHTML = '';
      document.getElementById('rSecondary').innerHTML = '';
      document.getElementById('resultBox').classList.add('show');
    })
    .finally(function() {
      btn.disabled = false;
      btn.textContent = 'Look up';
    });
}

document.getElementById('lookupBtn').addEventListener('click', doLookup);
document.getElementById('wordInput').addEventListener('keydown', function(e){ if (e.key === 'Enter') doLookup(); });

// ── Save / Discard ────────────────────────────────────────
document.getElementById('saveBtn').addEventListener('click', function() {
  if (!preview) return;
  var note = document.getElementById('noteInput').value.trim();
  var card = {
    word: preview.word,
    translation: preview.translation,
    targetLang: preview.targetLang,
    grammarLine: grammarLine(preview.grammar),
    secondaryTitles: (preview.secondary || []).map(function(s){ return s.title; }).join(', '),
    note: note,
    savedOn: todayStr(),
    score: 0,
    archived: false
  };
  var idx = cards.findIndex(function(c){ return c.word.toLowerCase() === card.word.toLowerCase(); });
  if (idx >= 0) { card.score = cards[idx].score; cards[idx] = card; }
  else cards.unshift(card);
  save();
  renderAll();
  document.getElementById('resultBox').classList.remove('show');
  document.getElementById('wordInput').value = '';
  preview = null;
});

document.getElementById('discardBtn').addEventListener('click', function() {
  document.getElementById('resultBox').classList.remove('show');
  preview = null;
});

// ── Render card lists ─────────────────────────────────────
function buildCard(c, i) {
  var badgeClass = c.score >= 2 ? 'b2' : c.score === 1 ? 'b1' : 'b0';
  var badgeLabel = c.score >= 2 ? 'Learned' : c.score === 1 ? 'Learning' : 'New';
  return '<div class="fc" data-i="' + i + '">' +
    '<div class="fc-front">' +
      '<div><div class="fc-word">' + esc(c.word) + '</div><div class="fc-gl">' + esc(c.grammarLine || '') + '</div></div>' +
      '<div><span class="fc-badge ' + badgeClass + '">' + badgeLabel + '</span></div>' +
    '</div>' +
    '<div class="fc-back">' +
      '<div class="fc-trans">' + esc(c.translation) + '</div>' +
      (c.secondaryTitles ? '<div style="font-size:12px;color:#76736d;margin-bottom:6px">' + esc(c.secondaryTitles) + '</div>' : '') +
      (c.note ? '<div class="fc-note">' + esc(c.note) + '</div>' : '') +
      '<div class="btn-row">' +
        '<button class="rate-btn" data-act="rate" data-v="0">Again</button>' +
        '<button class="rate-btn" data-act="rate" data-v="1">Good</button>' +
        '<button class="rate-btn" data-act="rate" data-v="2">Easy</button>' +
        '<button class="arch-btn" data-act="archive">' + (c.archived ? 'Unarchive' : 'Archive') + '</button>' +
        '<button class="del-btn" data-act="delete">Delete</button>' +
      '</div>' +
    '</div>' +
  '</div>';
}

function attachEvents(container) {
  container.querySelectorAll('.fc-front').forEach(function(front) {
    front.addEventListener('click', function(e) {
      if (e.target.closest('[data-act]')) return;
      front.closest('.fc').classList.toggle('open');
    });
  });
  container.querySelectorAll('[data-act]').forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      var i = parseInt(btn.closest('.fc').dataset.i);
      var act = btn.dataset.act;
      if (act === 'rate')    { cards[i].score = parseInt(btn.dataset.v); save(); renderAll(); }
      if (act === 'archive') { cards[i].archived = !cards[i].archived;  save(); renderAll(); }
      if (act === 'delete')  { if (confirm('Delete "' + cards[i].word + '"?')) { cards.splice(i, 1); save(); renderAll(); } }
    });
  });
}

function fillPane(el, list) {
  if (!list.length) { el.innerHTML = '<div class="empty">No cards here yet.</div>'; return; }
  el.innerHTML = '<div class="card-list">' + list.map(function(c){ return buildCard(c, cards.indexOf(c)); }).join('') + '</div>';
  attachEvents(el);
}

function renderAll() {
  fillPane(document.getElementById('pane-today'),   cards.filter(function(c){ return c.savedOn === todayStr() && !c.archived; }));
  fillPane(document.getElementById('pane-all'),     cards.filter(function(c){ return !c.archived; }));
  fillPane(document.getElementById('pane-archive'), cards.filter(function(c){ return c.archived; }));
}

renderAll();
</script>
</body>
</html>
